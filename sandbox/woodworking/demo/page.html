<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#18291f" />
    <title>森林之家 · 木作间</title>
    <style>
      @layer how-layout {
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Microsoft YaHei',
          sans-serif;
        color: var(--how-ink, #fff1d5);
        background: var(--how-recess, #18291f);
        padding: clamp(8px, 1.5vw, 24px);
      }
      main,
      footer {
        max-width: 1400px;
        margin: auto;
      }
      footer {
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        padding: 16px;
        color: var(--how-muted);
        font-size: 13px;
      }
      summary,
      footer button {
        cursor: pointer;
      }
      summary {
        font-weight: 650;
        min-height: 44px;
        padding: 10px 14px;
      }
      #ledger {
        max-height: 195px;
        overflow: auto;
        margin: 8px 0;
      }
      #ledger div {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      #ledger i {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }
      footer button {
        background: transparent;
        border: 0;
        color: var(--how-muted);
        font: inherit;
        min-height: 44px;
        padding: 10px 14px;
      }
      #notice:empty {
        display: none;
      }
      #notice {
        padding: 10px 12px;
      }
      }
    </style>
  </head>
  <body data-how-ui="timber">
    <main id="workshop"></main>
    <footer data-timber-surface="panel" data-timber-material="bark" data-timber-tone="dark" data-timber-seed="woodworking-gallery">
      <details id="gallery">
        <summary data-timber-surface="button" data-timber-material="plank" data-timber-tone="moss" data-timber-seed="woodworking-gallery-open">作品匣 · <span id="count">0</span></summary>
        <div id="ledger"></div>
      </details>
      <span id="notice" role="status" data-timber-surface="badge" data-timber-material="recess" data-timber-seed="woodworking-host-notice"></span><button id="replenish" type="button" data-timber-surface="button" data-timber-tone="moss" data-timber-intent="danger" data-timber-seed="woodworking-replenish">重置练习台</button>
    </footer>
    <!-- APPLICATION -->
  </body>
</html>
