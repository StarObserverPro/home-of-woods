<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林间动作室 · 森林之家</title></head><body><div id="app"><header><span class="eyebrow">HOME OF WOODS / MOTION STUDIES 01</span><h1>林间动作室<span>独立沙盒</span></h1><p>最后一斧，树缓缓倒下。其余的小动作，也在这里试一试。</p></header><nav aria-label="选择动作"><button data-action="fell" class="active">01 <b>伐断树木</b></button><button data-action="climb">02 <b>抱树攀爬</b></button><button data-action="gather">03 <b>蹲下采菇</b></button><button data-action="pray">04 <b>合掌祈祷</b></button><button data-action="pickup">05 <b>地面捡碎柴</b></button></nav><main id="stage"><div id="viewport"></div><div class="stage-label"><span id="phase">准备场景</span><p id="caption">正在载入角色与树林…</p></div><div class="views"><button id="wide">全景</button><button id="close">看近一点</button><button id="cut">断口特写</button></div><div class="hint">拖动环视 · 滚轮缩放</div></main><footer><div class="transport"><button id="play" aria-label="暂停">暂停</button><button id="replay">重播</button><label class="scrub"><span id="time">0.00 / 7.00 s</span><input id="timeline" aria-label="动作时间" type="range" min="0" max="7" step="0.01" value="0"></label><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">½ 慢放</option><option value="0.25">¼ 慢放</option></select><label><input id="loop" type="checkbox" checked> 循环</label></div><div class="options"><label>树形 <select id="species"><option value="broadleaf">阔叶树</option><option value="pine">松树</option></select></label><label>放树方向 <select id="direction"><option value="0">东 · 顺坐标</option><option value="1.5707963267948966">北 · 横向</option><option value="3.141592653589793">西 · 反向</option><option value="4.71238898038469">南 · 横向</option></select></label><label>地面 <select id="slope"><option value="0">平地</option><option value="0.12">缓坡</option></select></label><label><input id="anchors" type="checkbox"> 显示动作基准点</label><label><input id="reduced" type="checkbox"> 减少动态</label><button id="capture">保存画面</button><span id="stats"></span></div><p class="footnote">五段表现预览 · 无库存、额度或存档操作 · <a href="./assets/licenses/Three-MIT.txt" target="_blank">许可</a></p></footer></div><script type="module" src="/src/main.js"></script></body></html>
