<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存兼容检查 · 示例数据</title></head>
<body><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { Warehouse } from '/src/ui/Warehouse.tsx';
import '/src/ui/style.css';
import { createGatheringRegistry } from '/src/domain/gathering-registry.ts';
import { RUNTIME_MODELS } from '/src/content/assets.ts';
import { ITEMS } from '/src/content/items.ts';
import { QUALITIES } from '/src/content/qualities.ts';
import { prepareInventoryPersistence, serializeInventory } from '/src/domain/inventory-persistence.ts';
import { warehouseSnapshot } from '/src/domain/warehouse-view.ts';
const source = JSON.stringify({schemaVersion:1,stacks:[
  {itemId:'mushroom',qualityId:'ordinary',quantity:6},
  {itemId:'mushroom',qualityId:'fine',quantity:2},
  {itemId:'mushroom',qualityId:'ungraded',quantity:4},
  {itemId:'compat.future-material',qualityId:'ordinary',quantity:7},
  {itemId:'branch',qualityId:'future-grade',quantity:3},
  {itemId:'wood',qualityId:'ordinary',quantity:5},
]});
const restored=prepareInventoryPersistence(source);
if(restored.decision==='protected')throw new Error(restored.diagnostics.join(';'));
function Review(){
  const [inventory,setInventory]=React.useState(restored.value);
  const [expanded,setExpanded]=React.useState(false);
  const [open,setOpen]=React.useState(true);
  const registry=createGatheringRegistry({assetIds:RUNTIME_MODELS.map(a=>a.assetId),
    items:expanded?[...ITEMS,{...ITEMS[0],itemId:'compat.future-material',name:'兼容材料示例'}]:ITEMS,
    qualities:expanded?[...QUALITIES,{qualityId:'future-grade',name:'示例品质',rank:2}]:QUALITIES});
  return React.createElement(React.Fragment,null,
    React.createElement('section',{style:{padding:'20px',color:'#f8f2df'}},
      React.createElement('p',null,'库存兼容检查 · 示例数据，独立于游戏进度'),
      React.createElement('button',{onClick:()=>setOpen(true)},'打开示例仓库'),
      React.createElement('button',{onClick:()=>{const result=prepareInventoryPersistence(serializeInventory(inventory));if(result.decision==='protected')throw new Error('Unexpected protection');setInventory(result.value);}},'JSON 往返重载'),
      React.createElement('button',{onClick:()=>setExpanded(!expanded)},expanded?'移除示例定义':'恢复示例定义')),
    React.createElement(Warehouse,{open,view:warehouseSnapshot({inventory},registry),onClose:()=>setOpen(false)}));
}
document.body.style.background='#253e33';
createRoot(document.getElementById('root')).render(React.createElement(Review));
</script></body></html>
