name: Transfer verified rarity VFX R2
on:
  push:
    branches: [feat/item-properties-rarity]
    paths: [.github/workflows/transfer-rarity-vfx-r2.yml]
permissions:
  contents: write
concurrency:
  group: rarity-vfx-r2-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'StarObserverPro/home-of-woods'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply exactly the tested presentation changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 86cb5829bb0b58bcff360632e75299608feaf65a
          curl --fail --location --proto '=https' --retry 2 --max-time 60 'https://sb-2e3zv8sjq3w4.vercel.run/verified-vfx-transfer.patch' --output /tmp/rarity-vfx-r2.patch
          echo '990d331db056667a6a6f10c04c6c293b48295231763beefdcc593b2bc8d62b17  /tmp/rarity-vfx-r2.patch' | sha256sum --check --strict
          git apply --check --index /tmp/rarity-vfx-r2.patch
          git apply --index /tmp/rarity-vfx-r2.patch
          git rm --cached .github/workflows/transfer-rarity-vfx-r2.yml
          test "$(git write-tree)" = d1e5a5cdbd2639748af46061bd2e250233815a71
          git add .github/workflows/transfer-rarity-vfx-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: visible enchanted surface flow and soft star glints'
          git push origin HEAD:refs/heads/feat/item-properties-rarity
      - uses: actions/upload-artifact@v4
        with:
          name: rarity-vfx-r2-preview
          retention-days: 1
          path: |
            evidence/item-vfx-r2/surface-motion.gif
            evidence/item-vfx-r2/day-crop.webp
            evidence/item-vfx-r2/default-distance-verified.png
            evidence/item-vfx-r2/night-verified.png
            evidence/item-vfx-r2/mobile-verified.png
