name: Wildlife P2 bootstrap archive
on:
  push:
    branches: [feat/wildlife-phase2]
    paths: [.github/workflows/wildlife-phase2-bootstrap.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Pack tracked project source
        run: git archive --format=tar HEAD | gzip -1 > /tmp/how-p2-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-p2-source
          path: /tmp/how-p2-source.tar.gz
          retention-days: 1
