name: Transfer verified rarity display modes R3
on:
  push:
    branches: [feat/item-properties-rarity]
    paths: [.github/workflows/transfer-rarity-modes-r3.yml]
permissions:
  contents: write
concurrency:
  group: rarity-modes-r3-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: ${{ github.repository == 'StarObserverPro/home-of-woods' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply the digest-verified tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e221ecc161ec161da97bbdd7f55729f1070bd312
          curl --fail --location --proto '=https' --retry 2 --max-time 90 'https://sb-5kypos81nz7c.vercel.run/verified-transfer.patch' --output /tmp/verified.patch
          echo '0b5739a35e378612bb7d21f4f1b27e511849dfdd6dd77e55bf38b0f2b7f24f97  /tmp/verified.patch' | sha256sum --check --strict
          git apply --check --index /tmp/verified.patch
          git apply --index /tmp/verified.patch
          git rm --cached .github/workflows/transfer-rarity-modes-r3.yml
          test "$(git write-tree)" = 6aa84891249dc8d75253e52b8c87608cdbdf308d
          # Retain this temporary workflow until the connector removes it after verification.
          git add .github/workflows/transfer-rarity-modes-r3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add three rarity display modes and soften only legendary emission'
          git push origin HEAD:refs/heads/feat/item-properties-rarity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rarity-modes-r3-preview
          path: evidence/item-vfx-r3/
          retention-days: 7
