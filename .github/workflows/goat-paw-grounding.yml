name: Goat ground-contact correction (one-time)
on:
  push:
    branches: [feat/wildlife-mountain-goat]
    paths: [.github/workflows/goat-paw-grounding.yml]
permissions:
  contents: write
jobs:
  ground:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Rebuild model from amended source and verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-mountain-goat.py
          echo '33d0c64eee260a0b426a29c728d2e76400b68bef061a3afb1897e1c2be7e4d84  public/assets/wildlife/mountain-goat.glb' | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,pathlib
          target=pathlib.Path('public/assets/manifest.json')
          data=json.loads(target.read_text())
          entry=next(x for x in data['assets'] if x['assetId']=='how-wildlife-mountain-goat')
          blob=pathlib.Path('public/assets/wildlife/mountain-goat.glb').read_bytes()
          entry['bytes']=len(blob)
          entry['sha256']=hashlib.sha256(blob).hexdigest()
          target.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Game regressions and historical evidence
        run: |
          npm ci
          npm run check
          npm run verify:evidence
          node tools/audit-delivery-evidence.mjs
      - name: Commit grounded model and remove one-shot CI
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/goat-paw-grounding.yml
          git add public/assets/manifest.json public/assets/wildlife/mountain-goat.glb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(wildlife): align mountain-goat hooves and gait geometry with terrain'
          git push origin HEAD:feat/wildlife-mountain-goat
