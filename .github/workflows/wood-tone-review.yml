name: Wood Tone Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wood-tone-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wood-tone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and Chinese fonts
        run: |
          npm exec -- playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run the same browser review as local
        env:
          HOW_REVIEW_EVIDENCE_DIR: ${{ runner.temp }}/how-wood-tone-review-evidence
        run: npm run verify:browser -- wood-tone
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wood-tone-evidence
          path: ${{ runner.temp }}/how-wood-tone-review-evidence/wood-tone/
          if-no-files-found: warn
          retention-days: 7
