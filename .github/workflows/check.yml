name: Game checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Exercise the actual game in WebGL
        run: |
          npm run dev > /tmp/home-of-woods-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 0.5
          done
          npm run check:browser
          npm run check:lifecycle
      - name: Save reproducible screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-browser-evidence
          path: |
            .cache/evidence/
            .cache/evidence-lifecycle/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
