name: Timber UI Review
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Timber UI review to run
        required: true
        default: desktop
        type: choice
        options: [desktop, mobile, modules, baseline, all]
permissions:
  contents: read
concurrency:
  group: timber-ui-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: true
jobs:
  timber-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(inputs.scope == 'all' && '["desktop","mobile","modules","baseline"]' || format('["{0}"]', inputs.scope)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the standalone woodworking dependencies
        if: matrix.scope == 'modules'
        run: npm --prefix sandbox/woodworking ci
      - name: Install Chromium and Chinese fonts
        run: |
          npm exec -- playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run the same browser review as local
        env:
          HOW_REVIEW_EVIDENCE_DIR: ${{ runner.temp }}/how-timber-ui-evidence
          REVIEW_SCOPE: ${{ matrix.scope }}
        run: npm run verify:browser -- "timber-$REVIEW_SCOPE"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timber-ui-evidence-${{ matrix.scope }}
          path: ${{ runner.temp }}/how-timber-ui-evidence/timber-${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 7
