name: Timber UI Review
on:
  pull_request:
    paths:
      - 'src/ui/**'
      - 'src/main.tsx'
      - 'sandbox/timber-ui/**'
      - 'sandbox/cabin-interior/**'
      - 'sandbox/woodworking/**'
      - 'tools/verification/timber-ui*'
      - 'tools/verify-ui-contract.mjs'
      - 'tools/ui-contract.json'
      - 'tests/timber-surface.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/timber-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timber-ui-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  timber-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [desktop, mobile, modules, baseline]
    env:
      TIMBER_EVIDENCE_DIR: /tmp/how-timber-evidence
      TIMBER_REVIEW_SCOPE: ${{ matrix.scope }}
      PLAYWRIGHT_LEGACY_SCREENSHOT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Check the shared UI contract and deterministic surface generator
        run: |
          npm run verify:ui
          node --experimental-strip-types --test tests/timber-surface.test.ts
      - run: npm run build
      - name: Build the standalone woodworking module
        if: matrix.scope == 'modules'
        run: |
          npm ci --prefix sandbox/woodworking
          npm run build --prefix sandbox/woodworking
      - name: Install Chromium and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Review real game UI and shared sandbox surfaces
        if: matrix.scope != 'baseline'
        run: node tools/verification/timber-ui-browser.mjs
      - name: Capture the original main UI for comparison
        if: matrix.scope == 'baseline'
        run: node tools/verification/timber-ui-baseline.mjs
      - name: Upload screenshots and specific layout failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timber-ui-evidence-${{ matrix.scope }}
          path: /tmp/how-timber-evidence/
          if-no-files-found: warn
          retention-days: 7
