name: Woodworking Stage Session
on:
  push:
    branches: [feat/woodworking-game-stage]
    paths: [.github/workflows/woodworking-stage-session.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export current tracked candidate
        run: |
          mkdir -p /tmp/woodworking-recovery
          git archive HEAD | gzip > /tmp/woodworking-recovery/source.tgz
          git rev-parse HEAD > /tmp/woodworking-recovery/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woodworking-recovery
          path: /tmp/woodworking-recovery
          retention-days: 1
