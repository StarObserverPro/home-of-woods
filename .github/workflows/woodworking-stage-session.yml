name: Woodworking Stage Session
on:
  push:
    branches: [feat/woodworking-game-stage]
    paths: [.github/workflows/woodworking-stage-session.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Official texture and license inputs
        run: |
          mkdir -p /tmp/woodworking-table
          python3 - <<'PY'
          import json,pathlib,urllib.request
          root=pathlib.Path('/tmp/woodworking-table')
          def get(url):
              r=urllib.request.Request(url,headers={'User-Agent':'HomeOfWoods-asset-preparation/1.0'})
              with urllib.request.urlopen(r,timeout=50) as f:return f.read()
          data=json.loads(get('https://api.polyhaven.com/files/wood_table'))
          for k in ['Diffuse','nor_gl','Rough']:
              item=data[k]['1k']['jpg'];url=item['url'];(root/url.split('/')[-1]).write_bytes(get(url))
          (root/'CC0-1.0.txt').write_bytes(get('https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: woodworking-table
          path: /tmp/woodworking-table
          retention-days: 1
