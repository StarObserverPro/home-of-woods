name: Woodworking Stage Session
on:
  push:
    branches: [feat/woodworking-game-stage]
    paths: [.github/workflows/woodworking-stage-session.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Apply checked workbench-only changes
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess
          p=json.loads(pathlib.Path('.woodworking-stage-finish.json').read_text())
          assert p['base']=='d76e85dae6e34e46ad07af08a394e5a4c4f525d6'
          subprocess.run(['git','merge-base','--is-ancestor',p['base'],'HEAD'],check=True)
          for name,change in p['files'].items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert name.startswith('sandbox/woodworking/') or name=='src/ui/timber/theme.css'
              s=path.read_text(); assert hashlib.sha256(s.encode()).hexdigest()==change['before'],name
              for start,end,text in reversed(change['spans']):
                  assert 0<=start<=end<=len(s)
                  s=s[:start]+text+s[end:]
              assert hashlib.sha256(s.encode()).hexdigest()==change['after'],name
              path.write_text(s)
          # Wait for the input-triggered frame before measuring a genuinely idle stage.
          test=pathlib.Path('sandbox/woodworking/test/browser.mjs')
          s=test.read_text();needle="const idle=await page.locator('canvas').getAttribute('data-draws');"
          assert s.count(needle)==1
          test.write_text(s.replace(needle,"await page.waitForTimeout(200);"+needle))
          pathlib.Path('.woodworking-stage-finish.json').unlink()
          PY
      - run: npm ci && npm ci --prefix sandbox/woodworking
      - name: Domain, interface and production bundle
        run: |
          mkdir -p /tmp/woodworking-final
          set -o pipefail
          npm --prefix sandbox/woodworking test | tee /tmp/woodworking-final/unit.log
          npm run verify:ui | tee /tmp/woodworking-final/ui.log
          npm --prefix sandbox/woodworking run build | tee /tmp/woodworking-final/build.log
          git diff --check
      - name: Preserve source on its feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/woodworking-game-stage
          test "$(git ls-remote origin refs/heads/feat/woodworking-game-stage | cut -f1)" = "$GITHUB_SHA"
          git add sandbox/woodworking/src sandbox/woodworking/test src/ui/timber/theme.css
          git add -u .woodworking-stage-finish.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finish workbench layout, stable view and allowance-only repair'
          git push origin HEAD:refs/heads/feat/woodworking-game-stage
          git rev-parse HEAD > /tmp/woodworking-final/head.txt
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Desktop, touch, scale preservation and save reload
        env:
          QA_EVIDENCE_DIR: /tmp/woodworking-final
        run: node sandbox/woodworking/test/browser.mjs
      - name: Collect usable package
        if: always()
        run: |
          cp sandbox/woodworking/dist/woodworking.html /tmp/woodworking-final/
          cp sandbox/woodworking/dist/THIRD_PARTY_NOTICES.txt /tmp/woodworking-final/
          cd sandbox/woodworking && npm pack --ignore-scripts --pack-destination /tmp/woodworking-final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woodworking-final
          path: /tmp/woodworking-final
          retention-days: 7
