name: Woodworking Stage Session
on:
  push:
    branches: [feat/woodworking-game-stage]
    paths: [.github/workflows/woodworking-stage-session.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix sandbox/woodworking
      - name: Source and locked build inputs
        run: |
          mkdir -p /tmp/woodworking-stage-inputs
          git archive HEAD | gzip > /tmp/woodworking-stage-inputs/main.tgz
          git archive 675063f6a8724f0941ca344dd2c7bf192da26f8f sandbox/woodworking docs/WOODWORKING_HANDWORK.md docs/WOODWORKING_TOOLS.md | gzip > /tmp/woodworking-stage-inputs/finite-saw.tgz
          tar -czf /tmp/woodworking-stage-inputs/dependencies.tgz node_modules sandbox/woodworking/node_modules
      - name: Download two official CC0 asset inputs
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse
          root=pathlib.Path('/tmp/woodworking-stage-inputs/assets'); root.mkdir()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'HomeOfWoods-asset-preparation/1.0 (one-time developer download)'})
              with urllib.request.urlopen(req,timeout=50) as r: return r.read()
          def urls(v):
              if isinstance(v,dict):
                  if isinstance(v.get('url'),str): yield v['url']
                  for k,x in v.items():
                      if k!='url': yield from urls(x)
              elif isinstance(v,list):
                  for x in v: yield from urls(x)
          for name in ['handsaw_wood','wood_table']:
              dest=root/name; dest.mkdir()
              try:
                  raw=get('https://api.polyhaven.com/files/'+name); (dest/'files.json').write_bytes(raw); data=json.loads(raw)
                  (dest/'info.json').write_bytes(get('https://api.polyhaven.com/info/'+name))
                  if name=='handsaw_wood': groups=[data['gltf']['1k']]
                  else: groups=[data[k]['1k']['jpg'] for k in ['diff','nor_gl','rough']]
                  entries=[]
                  for url in dict.fromkeys(u for group in groups for u in urls(group)):
                      assert urllib.parse.urlparse(url).hostname in ['dl.polyhaven.org','dl.polyhaven.com']
                      file=urllib.parse.urlparse(url).path.split('/')[-1]
                      content=get(url); (dest/file).write_bytes(content); entries.append({'file':file,'url':url,'bytes':len(content)})
                  (dest/'download.json').write_text(json.dumps(entries,indent=2))
                  print(name,entries)
              except Exception as e:
                  (dest/'ERROR.txt').write_text(str(e)); print(name,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woodworking-stage-inputs
          path: /tmp/woodworking-stage-inputs
          retention-days: 1
