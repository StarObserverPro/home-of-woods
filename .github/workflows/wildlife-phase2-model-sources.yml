name: Wildlife P2 candidate assets
on:
  push:
    branches: [feat/wildlife-phase2]
    paths: [.github/workflows/wildlife-phase2-model-sources.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read actual free sources (do not commit until audited)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-models
          curl --retry 3 --fail --location --silent --show-error "https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Ultimate%20Animated%20Animals%20-%20July%202021/glTF/Stag.gltf" -o /tmp/p2-models/Stag.gltf
          curl --retry 3 --fail --location --silent --show-error "https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Ultimate%20Animated%20Animals%20-%20July%202021/License.txt" -o /tmp/p2-models/Quaternius-License.txt
          node --input-type=module -e '
            import fs from "node:fs/promises";
            const response=await fetch("https://gobkit.com/api/free");if(!response.ok)throw Error("Gobkit catalog unavailable "+response.status);
            const doc=await response.json();const items=doc.packs?.flatMap(p=>p.models||[])||[];
            const goat=items.find(x=>/goat/i.test(x.name||x.id||x.url||""));
            if(!goat||!goat.url)throw Error("Goat not found in pack manifest");
            const uri=new URL(goat.url);if(uri.hostname!=="gobkit.com")throw Error("unexpected asset host");
            const raw=await fetch(uri);if(!raw.ok)throw Error("Goat download failed "+raw.status);
            await fs.writeFile("/tmp/p2-models/Goat.glb",Buffer.from(await raw.arrayBuffer()));
            await fs.writeFile("/tmp/p2-models/gobkit-goat-metadata.json",JSON.stringify({model:goat,pack:doc.packs?.find(p=>p.models?.some(m=>m.url===goat.url))?.name},null,2));
          '
          sha256sum /tmp/p2-models/* > /tmp/p2-models/SHA256SUMS.txt
          head -c 1500 /tmp/p2-models/gobkit-goat-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-p2-model-candidates
          path: /tmp/p2-models/
          retention-days: 1
