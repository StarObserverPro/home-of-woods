name: Prototype Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect documentation-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs_only=false
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/prototype-paths"
            while IFS= read -r -d '' changed; do
              case "$changed" in
                docs/*.md|.github/pull_request_template.md) docs_only=true ;;
                */*) docs_only=false; break ;;
                *.md) docs_only=true ;;
                *) docs_only=false; break ;;
              esac
            done < "$RUNNER_TEMP/prototype-paths"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == true ]]; then git diff --check "$BASE_SHA" HEAD; fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: steps.changes.outputs.docs_only != 'true'
        run: |
          npm ci
          npm run verify:assets
          npm run build
          npm run test:prototype
