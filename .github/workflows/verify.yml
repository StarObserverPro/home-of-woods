name: Prototype Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify:assets
      - run: npm run build
      # Test the current clothing feature; old evidence and scene-sandbox
      # regressions are not prototype merge gates.
      - run: node --experimental-strip-types --test tests/wardrobe.test.ts tests/character-wardrobe.test.ts tests/merchant.test.ts tests/food-foundation.test.ts tests/day-cycle.test.ts tests/affix-vfx-library.test.ts tests/release-integration.test.ts
        if: ${{ hashFiles('tests/wardrobe.test.ts') != '' }}
