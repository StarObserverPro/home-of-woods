name: Woodworking Session
on:
  push:
    branches: [feat/woodworking-finite-saw]
    paths: [.github/workflows/woodworking-session.yml]
permissions:
  contents: write
concurrency:
  group: woodworking-finite-saw-publish
  cancel-in-progress: false
jobs:
  publish-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact payload already tested in run 43469432124
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/woodworking-finite-saw'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil, subprocess
          raw = lzma.decompress(base64.b64decode(''.join(pathlib.Path(f'.woodworking-transport/part-{i}.txt').read_text().strip() for i in range(5)), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '89410c79e6ad6dfa259e7d446c37834b297fac4fa0723111bb19c4ec2c247a11'
          patch = json.loads(raw)
          assert patch['base'] == 'd6d621d4f827229d3d312a69ac679453844eaca4'
          subprocess.run(['git', 'merge-base', '--is-ancestor', patch['base'], 'HEAD'], check=True)
          named = {'README.md', 'docs/WOODWORKING_HANDWORK.md', 'docs/WOODWORKING_TOOLS.md', 'docs/scopes/woodworking-finite-saw.md', 'docs/scopes/woodworking-handwork-sandbox.md', '.github/workflows/woodworking-browser.yml'}
          manifest = {}
          for name, change in patch['files'].items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert name in named or name.startswith('sandbox/woodworking/')
              if 'content' in change:
                  result = change['content']
              else:
                  result = path.read_text(encoding='utf-8')
                  assert hashlib.sha256(result.encode()).hexdigest() == change['base_sha256'], name
                  for start, end, text in reversed(change['spans']):
                      assert 0 <= start <= end <= len(result)
                      result = result[:start] + text + result[end:]
              digest = hashlib.sha256(result.encode()).hexdigest()
              assert digest == change['sha256'], name
              if name.startswith('.github/'):
                  assert path.read_bytes() == result.encode(), 'Workflow must already be installed by authorized connector'
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(result, encoding='utf-8')
              manifest[name] = digest
          shutil.rmtree('.woodworking-transport')
          pathlib.Path('/tmp/woodworking-publish').mkdir(exist_ok=True)
          pathlib.Path('/tmp/woodworking-publish/source-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(f'CHECKSUM_PASS: {len(manifest)} tested source files; workflows unchanged')
          PY
          git diff --check
          test "$(git ls-remote origin refs/heads/feat/woodworking-finite-saw | cut -f1)" = "$GITHUB_SHA"
          git add README.md docs/WOODWORKING_HANDWORK.md docs/WOODWORKING_TOOLS.md docs/scopes/woodworking-finite-saw.md docs/scopes/woodworking-handwork-sandbox.md sandbox/woodworking
          git add -u .woodworking-transport
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: rebuild tenon workbench around selected faces and finite saw cuts'
          git push origin HEAD:refs/heads/feat/woodworking-finite-saw
          git rev-parse HEAD > /tmp/woodworking-publish/verified-head.txt
          git rev-parse HEAD^{tree} > /tmp/woodworking-publish/verified-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: woodworking-published-source
          path: /tmp/woodworking-publish
          retention-days: 7
