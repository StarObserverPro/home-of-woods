name: Woodworking Session
on:
  push:
    branches: [feat/woodworking-finite-saw]
    paths: [.github/workflows/woodworking-session.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for isolated local verification
        run: git archive --format=tar HEAD | gzip > /tmp/woodworking-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: woodworking-source
          path: /tmp/woodworking-source.tgz
          retention-days: 1
