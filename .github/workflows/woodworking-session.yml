name: Woodworking Session
on:
  push:
    branches: [feat/woodworking-finite-saw]
    paths: [.github/workflows/woodworking-session.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix sandbox/woodworking
      - name: Export locked build tools for isolated local verification
        run: tar -czf /tmp/woodworking-tools.tgz sandbox/woodworking/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: woodworking-tools
          path: /tmp/woodworking-tools.tgz
          retention-days: 1
