name: Lighting Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighting-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and Chinese fonts
        run: |
          npm exec -- playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run the same browser review as local
        env:
          HOW_REVIEW_EVIDENCE_DIR: ${{ runner.temp }}/how-lighting-review-evidence
        run: npm run verify:browser -- lighting
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-review-evidence
          path: ${{ runner.temp }}/how-lighting-review-evidence/lighting/
          if-no-files-found: warn
          retention-days: 7
