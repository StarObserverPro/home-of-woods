name: Lighting Review
on:
  push:
    branches: [feat/local-occlusion-lighting]
permissions:
  contents: read
concurrency:
  group: lighting-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate-reviewed-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/local-occlusion-lighting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-occlusion-lighting
      - name: Apply hash-checked integration only to this feature branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f tools/apply-lighting-integration.py
          python3 tools/apply-lighting-integration.py
          git rm tools/apply-lighting-integration.py
          git add src sandbox/cabin-interior/src tests/local-occlusion.test.ts tools/verification/lighting-review.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: anchor building occlusion to authored floor and wall geometry'
          git push origin HEAD:refs/heads/feat/local-occlusion-lighting
