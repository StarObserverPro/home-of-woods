name: Lighting Review
on:
  pull_request:
    paths:
      - 'src/**'
      - 'sandbox/cabin-interior/src/**'
      - 'tests/local-occlusion*.test.ts'
      - 'tools/verification/lighting-review.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lighting-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighting-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/local-occlusion*.test.ts tests/cabin-interior.test.ts
      - run: npm run verify:cabin-assets && npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node tools/verification/lighting-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighting-review-evidence
          path: /tmp/how-lighting-evidence/
          if-no-files-found: warn
          retention-days: 7
