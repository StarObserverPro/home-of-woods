name: Wildlife phase-one checks
on:
  push:
    branches: [feat/wildlife-phase1]
permissions:
  contents: read
concurrency:
  group: wildlife-phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'StarObserverPro/home-of-woods' && github.ref == 'refs/heads/feat/wildlife-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Temporary intake permission, removed after the reviewed binary assets are committed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - run: npm ci
      - name: Apply reviewed source and admit hash-locked CC0 assets
        run: |
          if test -f tools/wildlife-integration.json; then
            node tools/apply-wildlife-integration.mjs
          fi
          if ! test -f public/assets/wildlife/squirrel.glb; then
            node tools/prepare-wildlife-assets.mjs --download
          fi
      - name: Rules, source licenses, types and build
        run: |
          set -o pipefail
          mkdir -p evidence/wildlife-phase1
          npm run check 2>&1 | tee evidence/wildlife-phase1/check.log
          npm run verify:evidence > evidence/wildlife-phase1/historical-audits.txt
          node tools/audit-delivery-evidence.mjs >> evidence/wildlife-phase1/historical-audits.txt
      - name: Commit admitted implementation to this branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/wildlife-phase1 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools docs README.md PARAMETERS.md public/assets sources/gobkit evidence/wildlife-phase1
          if ! git diff --cached --quiet; then
            git commit -m 'feat(wildlife): integrate common animals, admitted assets and regression checks'
            git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:feat/wildlife-phase1
          fi
      - name: Install isolated browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual game and lifecycle checks
        run: |
          npm run dev > /tmp/wildlife-vite.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          node tools/capture-wildlife.mjs
      - name: Preserve browser receipts on the implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add evidence/wildlife-phase1/browser
          if ! git diff --cached --quiet; then
            git commit -m 'test(wildlife): capture real desktop/mobile scenes and five reentries'
            git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:feat/wildlife-phase1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildlife-phase1-evidence
          path: evidence/wildlife-phase1/
          retention-days: 7
          if-no-files-found: error
