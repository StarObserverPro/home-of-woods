name: Wildlife phase-one checks
on:
  push:
    branches: [feat/wildlife-phase1]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'sources/gobkit/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
  pull_request:
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'sources/gobkit/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wildlife-phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - run: npm ci
      - name: Rules, admitted assets, types and production build
        run: |
          set -o pipefail
          mkdir -p /tmp/wildlife-verification
          npm run check 2>&1 | tee /tmp/wildlife-verification/check.log
          npm run verify:evidence > /tmp/wildlife-verification/historical-audits.txt
          node tools/audit-delivery-evidence.mjs >> /tmp/wildlife-verification/historical-audits.txt
      - name: Install isolated browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture current game and lifecycle checks
        run: |
          # Never publish committed old screenshots as results of this run.
          rm -rf evidence/wildlife-phase1/browser
          npm run dev > /tmp/wildlife-verification/vite.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          node tools/capture-wildlife.mjs
      - name: Collect current browser receipts
        if: always()
        run: |
          if test -f evidence/wildlife-phase1/browser/report.json; then
            CURRENT=$(git rev-parse HEAD)
            ACTUAL=$(node -p 'JSON.parse(require("fs").readFileSync("evidence/wildlife-phase1/browser/report.json","utf8")).sourceCommit')
            if test "$CURRENT" = "$ACTUAL"; then cp -a evidence/wildlife-phase1/browser /tmp/wildlife-verification/; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wildlife-phase1-evidence
          path: /tmp/wildlife-verification/
          retention-days: 7
          if-no-files-found: error
