name: Original mountain goat ground-contact fix
on:
  push:
    branches: [feat/wildlife-mountain-goat]
    paths: [.github/workflows/mountain-goat-grounding.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Rebuild generated goat with parent-relative torso
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-mountain-goat.py
          echo "de30051117e21b0d3dd0f60e366925fcb697b8929d6c38af6c93082d081f59d0  public/assets/wildlife/mountain-goat.glb" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path("public/assets/manifest.json")
          document=json.loads(p.read_text(encoding="utf8"))
          entry=next(x for x in document["assets"] if x["assetId"]=="how-wildlife-mountain-goat")
          payload=Path(entry["file"]).read_bytes()
          entry["bytes"]=len(payload)
          entry["sha256"]=hashlib.sha256(payload).hexdigest()
          p.write_text(json.dumps(document,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          assert entry["bytes"]==433764
          assert entry["sha256"]=="de30051117e21b0d3dd0f60e366925fcb697b8929d6c38af6c93082d081f59d0"
          PY
      - name: Validate grounded animation, asset hashes and entire project
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run verify:evidence
          node tools/audit-delivery-evidence.mjs
      - name: Commit approved source fix and remove temporary staging
        shell: bash
        run: |
          set -euo pipefail
          for file in tools/goat-stage/00.b64 tools/goat-stage/overlay.b64 .github/workflows/goat-build-snapshot.yml .github/workflows/mountain-goat-once.yml .github/workflows/mountain-goat-grounding.yml; do
            if test -f "$file"; then git rm "$file"; fi
          done
          git add tools/build-mountain-goat.py tests/wildlife-mountain-goat.test.ts public/assets/wildlife/mountain-goat.glb public/assets/manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m "fix(wildlife): ground original mountain goat's animated hooves"
          git push origin HEAD:feat/wildlife-mountain-goat
