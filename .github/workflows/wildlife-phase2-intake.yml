name: Wildlife phase two audited intake (one-time)
on:
  push:
    branches: [feat/wildlife-phase2]
    paths: [.github/workflows/wildlife-phase2-intake.yml]
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          cat tools/p2-overlay/{00,01,02,03}.b64 | base64 -d > /tmp/phase2.patch.xz
          echo "8347632a4af9d89fc550b8f60c8f898842276b6be27b707017df89bb4b518d44  /tmp/phase2.patch.xz" | sha256sum -c -
          xz -dc /tmp/phase2.patch.xz > /tmp/phase2.patch
          git apply --check /tmp/phase2.patch
          git apply /tmp/phase2.patch
      - name: Obtain exact audited CC0 source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/quaternius/ultimate-animated-animals sources/gobkit/animalB
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Ultimate%20Animated%20Animals%20-%20July%202021/glTF/Stag.gltf" -o sources/quaternius/ultimate-animated-animals/Stag.gltf
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Ultimate%20Animated%20Animals%20-%20July%202021/License.txt" -o sources/quaternius/ultimate-animated-animals/License.txt
          curl --fail --location --retry 3 --silent --show-error "https://gobkit.com/freebies/animalB/Goat.glb" -o sources/gobkit/animalB/Goat.glb
          echo "170b964909d16d1ab4d428b1d714f25016913d32481acd9c3d62923192583be6  sources/quaternius/ultimate-animated-animals/Stag.gltf" | sha256sum -c -
          echo "83d8959f9fc56353ed571fbe2dc52e4bcd64508e2399501cd45ac2ce3df0bf8c  sources/quaternius/ultimate-animated-animals/License.txt" | sha256sum -c -
          echo "51f7399bb76ea5175ac4d7c136c50b74f86250664c1f6b1acff48e5322f09ea0  sources/gobkit/animalB/Goat.glb" | sha256sum -c -
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://gobkit.com/api/free');if(!r.ok) throw new Error('Missing catalogue');
          const catalog=await r.json(), packs=catalog.packs||[], pack=packs.find(p=>p.models?.some(m=>m.name==='Goat'));
          const model=pack?.models.find(m=>m.name==='Goat');
          if(!model||model.url!=='https://gobkit.com/freebies/animalB/Goat.glb'||!/CC0/.test(model.license)) throw new Error('Source licence mismatch');
          await writeFile('sources/gobkit/animalB/catalog.json',JSON.stringify({model,pack:pack.name},null,2));
          NODE
      - name: Normalize and verify game assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          python tools/prepare-landmark-assets.py
          echo "c5b8cedcb2e8cb29cc88719f392bb13dc832e464cc821b952b981ccd502959ae  public/assets/wildlife/stag.glb" | sha256sum -c -
          echo "1e8f3f474945055fe5cd6ba7ef531a31578f69f4f7250d9853922e89cec9264a  public/assets/wildlife/goat.glb" | sha256sum -c -
      - name: Tests, production build and existing historical evidence
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run verify:evidence
          node tools/audit-delivery-evidence.mjs
      - name: Keep recurring verification, discard temporary upload scaffolding
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/wildlife-phase2-verify.yml <<'YAML'
          name: Wildlife phase-two verification
          on:
            push:
              branches: [feat/wildlife-phase2]
              paths: ['src/**', 'tests/**', 'public/assets/**', 'sources/**', 'tools/**', 'docs/WILDLIFE_PHASE2.md', '.github/workflows/wildlife-phase2-verify.yml']
            pull_request:
              paths: ['src/**', 'tests/**', 'public/assets/**', 'sources/**', 'tools/**', 'docs/WILDLIFE_PHASE2.md']
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22.16.0'
                - run: npm ci
                - run: npm run check
                - run: npm run verify:evidence
                - run: node tools/audit-delivery-evidence.mjs
          YAML
          git rm -r tools/p2-overlay
          git rm .github/workflows/wildlife-phase2-bootstrap.yml .github/workflows/wildlife-phase2-model-sources.yml .github/workflows/wildlife-phase2-intake.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m "feat(wildlife): distant stag and white goat chance encounters"
          git push origin HEAD:feat/wildlife-phase2
