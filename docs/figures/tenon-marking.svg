<svg xmlns="http://www.w3.org/2000/svg" width="840" height="356" viewBox="0 0 840 356" role="img" aria-labelledby="title desc">
  <title id="title">直榫三视图与方木放样</title>
  <desc id="desc">左侧方木上仅有宽热区与略有偏差的玩家墨线。右侧俯视、正视和从右端看的端视图显示同一个直榫。示例方木长八十毫米，截面三十毫米见方，右端二十毫米的榫头宽十四毫米、保留全高。俯视图高亮上侧榫颊线。</desc>
  <defs>
    <linearGradient id="zone"><stop offset="0" stop-color="#e0ad4c" stop-opacity="0"/><stop offset=".45" stop-color="#e0ad4c" stop-opacity=".55"/><stop offset="1" stop-color="#e0ad4c" stop-opacity=".55"/></linearGradient>
    <style>text{font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#303c3a}.heading{font-size:19px;font-weight:650}.small{font-size:13px}.dim{font-size:12px;fill:#53635e}.outline{fill:#f4eee2;stroke:#3c4944;stroke-width:1.6;stroke-linejoin:round}.guide{fill:none;stroke:#76847c;stroke-width:1}</style>
  </defs>
  <rect width="840" height="356" rx="12" fill="#faf9f5"/>
  <path d="M337 24v308" stroke="#dcded4"/>
  <text x="24" y="41" class="heading">工件 · 放样</text><text x="362" y="41" class="heading">图纸 · 直榫</text>
  <text x="24" y="68" class="small">翻转木料，在当前加工面上画线。</text>
  <g stroke="#765e41" stroke-width="1.5" stroke-linejoin="round">
    <path d="M31 162l223 0 43-40H74z" fill="#ddc79f"/>
    <path d="M31 162h223v70H31z" fill="#bca078"/>
    <path d="M254 162l43-40v70l-43 40z" fill="#cdb18b"/>
  </g>
  <path d="M154 162h100l43-40H197z" fill="url(#zone)"/>
  <path d="M222 140l56-3" stroke="#205d88" stroke-width="3" stroke-linecap="round"/>
  <rect x="24" y="273" width="32" height="12" fill="url(#zone)"/><text x="65" y="284" class="small">当前加工区域</text>
  <path d="M25 309h30" stroke="#205d88" stroke-width="3"/><text x="65" y="314" class="small">玩家墨线</text>
  <text class="small" x="362" y="68">示例尺寸（mm） · 两侧各收 8，榫头保留全高</text>
  <text class="small" x="362" y="146">俯视</text>
  <path class="outline" d="M415 107h150v20h50v35h-50v20H415z"/>
  <path d="M565 127h50" stroke="#ae461b" stroke-width="3.4"/>
  <g class="guide"><path d="M415 102V86m200 37V86M415 92h200m-200-3v6m200-6v6"/><path d="M565 185v17m50-34v34m-50-5h50m-50-3v6m50-6v6"/></g>
  <text x="515" y="88" text-anchor="middle" class="dim">80</text><text x="590" y="211" text-anchor="middle" class="dim">20</text>
  <text class="small" x="362" y="268">正视</text><path class="outline" d="M415 227h200v75H415z"/><path d="M565 227v75" stroke="#3c4944" stroke-width="1.6"/>
  <text class="small" x="704" y="211">右端视</text><path class="outline" d="M693 227h75v75h-75z"/><path d="M713 227v75m35-75v75" stroke="#3c4944" stroke-width="1.6"/>
  <g class="guide"><path d="M713 305v15m35-15v15m-35-5h35m-35-3v6m35-6v6"/><path d="M773 227h17m-17 75h17m-5-75v75m-3-75h6m-6 75h6"/></g>
  <text x="731" y="333" text-anchor="middle" class="dim">14</text><text x="791" y="269" class="dim">30</text>
  <path d="M656 130h24" stroke="#ae461b" stroke-width="3.4"/><text x="689" y="135" class="small">选中的榫颊线</text>
</svg>
