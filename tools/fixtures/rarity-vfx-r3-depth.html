<!doctype html><html><head><meta charset="utf-8"><title>VFX depth verification</title></head><body style="margin:0"><script type="module">
import * as THREE from 'three';
import {Resources} from '/src/scene/resources.ts';
import {createItemSurface} from '/src/scene/item-surface.ts';
const resources=new Resources(),effects=createItemSurface(resources),scene=new THREE.Scene();scene.background=new THREE.Color('#35473c');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(360,300);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
let errors=0;renderer.debug.onShaderError=()=>errors++;
const camera=new THREE.PerspectiveCamera(40,1.2,.1,50);camera.position.set(0,1.2,4);camera.lookAt(0,.35,0);
scene.add(new THREE.HemisphereLight('#ffffff','#405040',1));const sun=new THREE.DirectionalLight('#ffffff',2);sun.position.set(2,4,3);scene.add(sun);
const mesh=new THREE.Mesh(resources.geometry('test',()=>new THREE.CylinderGeometry(.52,.6,.7,9)),resources.material('#855739'));mesh.position.y=.35;scene.add(mesh);
const wall=new THREE.Mesh(resources.geometry('wall',()=>new THREE.BoxGeometry(4,4,.1)),resources.own(new THREE.MeshBasicMaterial({color:'#314f54'})));wall.position.set(0,.5,1);scene.add(wall);
window.depthTest={render(grade='legendary',blocked=true,dt=0,mode='full',night=0){effects.setMode(mode);effects.update(0,false,night);effects.apply(mesh,{rarityId:grade});effects.update(dt);wall.visible=blocked;renderer.render(scene,camera);return {image:renderer.domElement.toDataURL('image/png'),errors,stats:effects.stats()};},effects,resources};window.ready=true;
</script></body></html>
